<!-- Page Content -->
<div class="content">
  <div class="container-fluid">

    <div class="row">
      <div class="col-md-8 offset-md-2">

      <!--  Account Content -->
        <div class="account-content">
          <div class="row align-items-center justify-content-center">
            <div class="col-md-7 col-lg-6 login-left">
              <img src="assets/doccure/img/login-banner.png" class="img-fluid" alt="Login Banner">
            </div>
            <div class="col-md-12 col-lg-6 login-right" *ngIf="submitted else codeForm">

              <div class="activation-message" *ngIf="isOkay; else activationError">
                <h2>Activation Successful!</h2>
                <p>Your account has been successfully activated.</p>
                <button class="btn btn-primary" (click)="redirectToLogin()" class="btn btn-primary btn-block btn-lg login-btn">Go to Login</button>
              </div>
              <ng-template #activationError>
                <div class="activation-error">
                  <h2>Activation Failed!</h2>
                   <p>{{ message }}</p> 
                  
                    <!-- (click)="submitted = false" -->
                </div>
              </ng-template>

            </div> 

            <!-- activation code Form -->
            <ng-template #codeForm >
              <div  class="col-md-12 col-lg-6 login-right ">
                <div class="login-header">
                  <h2>Type your activation code</h2>
                  <p class="small text-muted">Please enter the 6-digit verification code we sent via e-mail address:</p>
                </div>
                <code-input [isCodeHidden]="false"
                            [codeLength]="6"
                            [code]="'number'"
                            (codeCompleted)="onCodeCompleted($event)">
                </code-input>

                <p></p>
                <button class="btn btn-primary btn-block btn-lg login-btn" type="submit"
                        (click)="redirectToLogin()">Go to Login</button>
              </div>

            </ng-template> 
            <!-- /activation code Form -->
          </div>
        </div>
        <!-- /Account Content  -->

      </div>
    </div>

  </div>

</div>
<!-- /Page Content -->
