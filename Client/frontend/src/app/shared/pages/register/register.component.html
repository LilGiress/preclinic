<!-- Page Content -->
<div class="content">
  <div class="container-fluid">

    <div class="row">
      <div class="col-md-8 offset-md-2">

        <!-- Register Content -->
        <div class="account-content">
          <div class="row align-items-center justify-content-center">
            <div class="col-md-7 col-lg-6 login-left">
              <img src="assets/doccure/img/login-banner.png" class="img-fluid" alt="Doccure Register">
            </div>
            <div class="col-md-12 col-lg-6 login-right">
              <div class="login-header">
                <h3 style="text-align: center;">Patient Register </h3>
              </div>
              <form [formGroup]="registrationForm">
                <!-- First Name -->
                <div class="form-group form-focus">
                  <input type="text" formControlName="firstname" class="form-control floating" placeholder="FirstName" name="firstname" />
                  <label class="focus-label">FirstName</label>
                  <div *ngIf="(f['firstname'].touched || f['firstname'].dirty) && f['firstname'].errors" class="text-danger">
                    <small *ngIf="f['firstname'].errors['required']">First name is required</small>
                  </div>
                </div>

                <!-- Last Name -->
                <div class="form-group form-focus">
                  <input type="text" formControlName="lastname" class="form-control floating" placeholder="LastName"  name="lastname"/>
                  <label class="focus-label">LastName</label>
                  <div *ngIf="(f['lastname'].touched || f['lastname'].dirty ) && f['lastname'].errors" class="text-danger">
                    <small *ngIf="f['lastname'].errors['required']">Last name is required</small>
                    <small *ngIf="f['lastname'].errors['minlength']">Last name should be at least 2 characters</small>
                  </div>
                </div>

                <!-- Email -->
                <div class="form-group form-focus">
                  <input type="email" formControlName="email" class="form-control floating" placeholder="E-mail"  name="email"/>
                  <label class="focus-label">Email</label>
                  <div *ngIf="(f['email'].touched || f['email'].dirty ) && f['email'].errors" class="text-danger">
                    <small *ngIf="f['email'].errors['required']">Email is required</small>
                    <small *ngIf="f['email'].errors['email']">Invalid email format</small>
                  </div>
                </div>

                <!-- Password -->
                <div class="form-group form-focus">
                  <input type="password" formControlName="password" class="form-control floating" placeholder="Password"  name="password"/>
                  <label class="focus-label">Password</label>
                  <div *ngIf="(f['password'].touched || f['password'].dirty ) && f['password'].errors" class="text-danger">
                    <small *ngIf="f['password'].errors['required']">Password is required</small>
                    <small *ngIf="f['password'].errors['minlength']">Minimum 6 characters</small>
                    <small *ngIf="f['password'].errors['maxlength']">Maximum 40 characters</small>
                  </div>
                </div>

                <!-- Confirm Password -->
                <div class="form-group form-focus">
                  <input type="password" formControlName="confirmPassword" class="form-control floating"
                    placeholder="Confirm-Password"  name="Confirm-Password"/>
                  <label class="focus-label">Confirm-Password</label>
                  <div *ngIf="(f['confirmPassword'].touched || f['confirmPassword'].dirty ) && f['confirmPassword'].errors" class="text-danger">
                    <small *ngIf="f['confirmPassword'].errors['required']">Confirmation is required</small>
                    <small *ngIf="f['confirmPassword'].errors['mismatch']">Passwords do not match</small>
                  </div>
                </div>

                <!-- Birthday -->
               <!-- <div class="form-group">
                  <input type="date" formControlName="birthday" class="form-control" placeholder="Birthday" />
                  <div *ngIf="(f['birthday'].touched || f['birthday'].dirty ) && f['birthday'].errors" class="text-danger">
                    <small *ngIf="f['birthday'].errors['required']">Birthday is required</small>
                  </div>
                </div>-->

                <div class="text-right">
                  <a class="forgot-link" [routerLink]="['/login']">Already have an account?</a>
                </div>
                <button class="btn btn-primary btn-block btn-lg login-btn" type="submit"
                  [disabled]="!registrationForm.valid" (click)="Submit()">Signup</button>

              </form>
              <!-- /Register Form -->

            </div>
          </div>
        </div>
        <!-- /Register Content  " -->

      </div>
    </div>

  </div>

</div>
<!-- /Page Content -->
