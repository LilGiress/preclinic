
<!-- Page Content -->
<div class="content">
  <div class="container-fluid">

    <div class="row">
      <div class="col-md-8 offset-md-2">

        <!-- Login Tab Content -->
        <div class="account-content">
          <div class="row align-items-center justify-content-center">
            <div class="col-md-7 col-lg-6 login-left">
              <img src="assets/img/login-banner.png" class="img-fluid" alt="Doccure Login">
            </div>
            <div class="col-md-12 col-lg-6 login-right">
              <div class="login-header">
                <h3>Login <span>Doccure</span></h3>
              </div>
              <form [formGroup]="loginForm">
                <div class="form-group form-focus">
                  <input type="email" class="form-control floating" formControlName="email" name="email">
                  <label class="focus-label">Email</label>
                  <div *ngIf="(f['email'].touched || f['email'].dirty ) && f['email'].touched && f['email'].errors "
                       class="alert alert-danger">
                    <small *ngIf="f['email'].errors['required']">email is required.</small>
                  </div>
                </div>
                <div class="form-group form-focus">
                  <input type="password" class="form-control floating" formControlName="password" name="password">
                  <label class="focus-label">Password</label>
                  <div *ngIf="(f['password'].touched || f['password'].dirty ) && f['password'].errors"
                       class="alert alert-danger">
                    <small *ngIf="f['password'].errors['required']">password is required.</small>
                    <small *ngIf="f['password'].errors['minlength']">password should be 6 character.</small>
                  </div>
                </div>
                <div class="text-right">
                  <a class="forgot-link" [routerLink]="['/forgot-password']">Forgot Password ?</a>
                </div>
                <button class="btn btn-primary btn-block btn-lg login-btn" type="submit" [disabled]="!loginForm.valid" (click)="onSubmit()">Login</button>
                
                <div class="text-center dont-have">Don’t have an account? <a  [routerLink]="['/register']">Register</a></div>
              </form>
            </div>
          </div>
        </div>  
        <!-- /Login Tab Content -->

      </div>
    </div>

  </div>

</div>
<!-- /Page Content 


 -->
