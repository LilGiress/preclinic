<!-- Page Content -->
<div class="content">
  <div class="container-fluid">

    <div class="row">
      <div class="col-md-8 offset-md-2">

        <!-- Account Content -->
        <div class="account-content">
          <div class="row align-items-center justify-content-center">
            <div class="col-md-7 col-lg-6 login-left">
              <img src="assets/doccure/img/login-banner.png" class="img-fluid" alt="Login Banner">
            </div>
            <div class="col-md-12 col-lg-6 login-right">
              <div class="login-header">
                <h3>Forgot Password?</h3>
                <p class="small text-muted">Enter your email to get a password reset link</p>
              </div>

                <!-- Forgot Password Form  -->
              <form [formGroup]="forgotform" (ngSubmit)="onSubmit()">
                <div class="form-group form-focus">
                  <input type="email" class="form-control floating" formControlName="email">
                  <label class="focus-label">Email</label>
                  <div *ngIf="(f['email'].touched || f['email'].dirty ) && f['email'].errors"
                       class="alert alert-danger">
                    <small *ngIf="f['email'].errors['required'] && f['email'].invalid"  >email is required.</small>
                    <small  *ngIf="f['email']?.errors?.['email']">
                        Format d'email invalide. Exemple : nom&#64;exemple.com
                      </small>
                   
                  </div>
                </div>
                <div class="text-right">
                  <a class="forgot-link" [routerLink]="['/login']">Remember your password?</a>
                </div>
                <button class="btn btn-primary btn-block btn-lg login-btn" type="submit"
                        [disabled]="!forgotform.valid">Reset Password</button>
              </form>  
              <!-- /Forgot Password Form -->

            </div>
          </div>
        </div>
        <!-- /Account Content -->

      </div>
    </div>

  </div>

</div>
<!-- /Page Content -->
