
<!-- Page Content -->
<div class="content">
  <div class="container-fluid">

    <div class="row">
      <div class="col-md-8 offset-md-2">

        <!-- Account Content -->
        <div class="account-content">
          <div class="row align-items-center justify-content-center">
            <div class="col-md-7 col-lg-6 login-left">
              <img src="assets/doccure/img/login-banner.png" class="img-fluid" alt="Login Banner">
            </div>
            <div class="col-md-12 col-lg-6 login-right">
              <div class="login-header">
                <h3>Reset Password?</h3>
                <p class="small text-muted">Enter the new password</p>
              </div>

              <!-- Forgot Password Form -->
              <form  [formGroup]="resetForm">
                <div class="form-group form-focus">
                  <input type="password" class="form-control floating" formControlName="password">
                  <label class="focus-label">Password</label>
                  <div *ngIf="(f['password'].touched || f['password'].dirty) && f['password'].errors"
                       class="alert alert-danger">
                    <small *ngIf="f['password'].errors['required']">password is required.</small>
                    <small *ngIf="f['password'].errors['minlength']">Minimum 6 characters.</small>
                    <small *ngIf="f['password'].errors['maxlength']">Maximum 40 characters</small>
                  </div>
                </div>
                <div class="form-group form-focus">
                  <input type="password" class="form-control floating" formControlName="confirmPassword">
                  <label class="focus-label">Confirme password</label>
                  <div *ngIf="(f['confirmPassword'].touched || f['confirmPassword'].dirty) && f['confirmPassword'].errors"
                       class="alert alert-danger">
                    <small *ngIf="f['confirmPassword'].errors['required']">Confirmation is required</small>
                    <small *ngIf="f['confirmPassword'].errors['mismatch']">Passwords do not match</small>
                  </div>
                </div>

                <button class="btn btn-primary btn-block btn-lg login-btn" [disabled]="!resetForm.valid" type="submit" (click)="onSubmit()">Reset Password</button>
              </form> 
              <!-- /Forgot Password Form -->

            </div>
          </div>
        </div>
        <!-- /Account Content -->

      </div>
    </div>

  </div>

</div>
<!-- /Page Content -->
