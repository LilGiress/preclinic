
<div class="pagination-wrapper" *ngIf="paginationState && paginationState.totalItems > 0">
  <div class="pagination-info">
    <span class="info-text">
      Affichage de {{ paginationState.startItem }} à {{ paginationState.endItem }} 
      sur {{ paginationState.totalItems }} entrées
    </span>
    
    <div class="page-size-selector" *ngIf="showPageSizeSelector">
      <label>Afficher</label>
      <select 
        [value]="itemsPerPage" 
        (change)="onPageSizeChange(+$any($event.target).value)"
        class="form-control form-control-sm">
        <option *ngFor="let size of pageSizeOptions" [value]="size">
          {{ size }}
        </option>
      </select>
      <label>entrées</label>
    </div>
  </div>

  <nav class="pagination-nav">
    <ul class="pagination">
      <!-- First Page Button -->
      <li class="page-item" *ngIf="showFirstLastButtons" [class.disabled]="!hasPreviousPage">
        <a class="page-link" (click)="goToFirstPage()" [attr.aria-disabled]="!hasPreviousPage">
          <i class="fa fa-angle-double-left"></i>
        </a>
      </li>

      <!-- Previous Button -->
      <li class="page-item" [class.disabled]="!hasPreviousPage">
        <a class="page-link" (click)="goToPreviousPage()" [attr.aria-disabled]="!hasPreviousPage">
          <i class="fa fa-angle-left"></i>
        </a>
      </li>

      <!-- Page Numbers -->
      <li 
        class="page-item" 
        *ngFor="let page of paginationState.pages"
        [class.active]="page === currentPage">
        <a class="page-link" (click)="goToPage(page)">
          {{ page }}
        </a>
      </li>

      <!-- Next Button -->
      <li class="page-item" [class.disabled]="!hasNextPage">
        <a class="page-link" (click)="goToNextPage()" [attr.aria-disabled]="!hasNextPage">
          <i class="fa fa-angle-right"></i>
        </a>
      </li>

      <!-- Last Page Button -->
      <li class="page-item" *ngIf="showFirstLastButtons" [class.disabled]="!hasNextPage">
        <a class="page-link" (click)="goToLastPage()" [attr.aria-disabled]="!hasNextPage">
          <i class="fa fa-angle-double-right"></i>
        </a>
      </li>
    </ul>
  </nav>
</div>
