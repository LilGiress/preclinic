<!-- Modal Creer un nouveau groupe -->
<div class="modal fade" id="nouveauRole" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-xl" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title h4 font-weight-bold">Créer un rôle </h5>
                <button type="button" class="close circle" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body p-3">
                <form>
                    <div class="mb-3">
                        <label>Libele</label>
                        <input type="text" class="form-control" required name="roleName" [(ngModel)]="role.name"
                        [ngModelOptions]="{standalone: true}"
                            placeholder="Ex: ADMIN">
                    </div>
                    <!-- Description du rôle -->
                    <div class="mb-3">
                        <label for="roleDesc" class="form-label">Description</label>
                        <textarea id="roleDesc" class="form-control" rows="2" [(ngModel)]="role.description"
                        [ngModelOptions]="{standalone: true}"></textarea>
                    </div>
                    <div *ngIf="message" class="alert alert-danger py-2">{{ message }}</div>

                    <div class="mb-3">
                        <div class="h5 p-2">Affectation des modules et permission au groupe</div>
                        <!-- Accordeons questions -->
                        @for (module of modulePermission; track module.label; let i = $index) {
                        <div class="accordion-perso-wrapper">
                            <div class="accordion-perso mb-20">
                                 <input type="radio" name="radio-a" class="input-accordeon" id="check11" checked>
                                    <label class="accordion-perso-label h5"  for="check11">
                                        <div> {{ module.label }}</div>

                                        <div class="d-flex">
                                            <div class="permission">
                                                <input type="checkbox" class="form-check-input"
                                                    [checked]="isAllSelectedModule(module)"
                                                    (change)="toggleAllModule(module, $any($event.target).checked)">
                                                <label class="permission">
                                                    Tous
                                                </label>
                                            </div>&emsp;
                                     
                                        </div>

                                    </label>
                                    <ng-container *ngFor="let sub of module.subModules;let j=index">
                                          <div class="accordion-perso-content">
                                            <div class=""> {{ sub.description }}</div>
                                    <div class="border d-flex justify-content-between rounded p-2 mb-20">
                                        
                                        <ng-container *ngFor="let action of sub.actions; trackBy:trackByAction">
                                          <div class="d-flex">
                                            <div class="permission">
                                                <input type="checkbox" name="quest1-1"
                                                 [disabled]="action.disabled"
                                                [(ngModel)]="action.isSelected"
                                                >&emsp;
                                                <label class="permission">
                                                     {{ action.label.replace('CAN_', '')
                                                        }}
                                                </label>
                                            </div>&emsp;
                                            
                                            
                                        </div>
                                        </ng-container>
                                        
                                        


                                    </div>
                                    

                                </div>
                                    </ng-container>
                                    
                                
                               
                            </div>

                        </div>
                        }


                    </div>

                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary btn-block" data-toggle="modal"
                    data-target="#modalvalidation" class="close" data-dismiss="modal" aria-label="Close"
                    (click)="saveRole()">Enregistrer</button>
            </div>
            <!-- [disabled]="submitted || !roleForm.form.valid"  -->
        </div>
    </div>
</div>
