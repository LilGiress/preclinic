<div class="page-wrapper">
    <div class="content">
        <div class="row">
            <div class="col-sm-5 col-5">
                <h4 class="page-title">Departments</h4>
            </div>
            <div class="col-sm-7 col-7 text-right m-b-30">
                <a href="javascript:void(0);" class="btn btn-primary btn-rounded" data-toggle="modal"
                    data-target="#exampleModal"><i class="fa fa-plus"></i> Ajouter un département</a>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <div class="table-responsive">
                    <table class="table table-striped custom-table mb-0 datatable">
                        <thead>
                            <tr>
                                <th>Nom</th>
                                <th>Description</th>
                                <th>Service</th>
                                <th>Status</th>
                                <th class="text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody *ngFor="let depart of departments">
                            <tr>
                                <td>{{depart.name}}</td>
                                <td>{{depart.description}}</td>
                                <td>
                                    <span
                                        [ngClass]="depart.status === statut.ACTIVE ? 'custom-badge status-green' : 'custom-badge status-red'">
                                        {{ depart.status === statut.ACTIVE ? 'Active' : 'Inactive' }}
                                    </span>
                                </td>


                                <td class="text-right">
                                    <div class="dropdown dropdown-action">
                                        <a href="#" class="action-icon dropdown-toggle" data-toggle="dropdown"
                                            aria-expanded="false"><i class="fa fa-ellipsis-v"></i></a>
                                        <div class="dropdown-menu dropdown-menu-right">
                                            <a class="dropdown-item" href="edit-department.html"><i
                                                    class="fa fa-pencil m-r-5"></i> Edit</a>
                                            <a class="dropdown-item" href="#" data-toggle="modal"
                                                data-target="#delete_department"><i class="fa fa-trash-o m-r-5"></i>
                                                Delete</a>
                                        </div>
                                    </div>
                                </td>
                            </tr>

                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</div>

<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLabel">Ajouter un département</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-lg-8 offset-lg-2">
                        <form [formGroup]="departmentForm">
                            <div class="form-group">
                                <label>Nom du département</label>
                                <input class="form-control" type="text">
                                <div *ngIf="f['name'].touched && f['name'].invalid" class="text-danger mt-1">
                                    <div *ngIf="f['name'].errors?.['required']">Le nom du département est requis.</div>

                                </div>
                            </div>
                            <div class="form-group">
                                <label>Description</label>
                                <textarea cols="30" rows="4" class="form-control"></textarea>
                                <div *ngIf="f['description'].touched && f['description'].invalid"
                                    class="text-danger mt-1">
                                    <div *ngIf="f['description'].errors?.['required']">La description est requis.
                                    </div>

                                </div>
                            </div>
                            <div class="form-group">

                                <label class="display-block">Services </label>
                                <select class=" form-control" formControlName="service">
                                    <option [value]="">-- Select -- </option>
                                    <option *ngFor="let serv of services" [value]="serv.id">{{ serv.name }}</option>
                                </select>
                                <div *ngIf="f['service'].touched && f['service'].invalid" class="text-danger mt-1">
                                    <div *ngIf="f['service'].errors?.['required']">Le service est requis.
                                    </div>
                                </div>

                            </div>

                            <div class="m-t-20 text-center">
                                <button class="btn btn-primary submit-btn"
                                    [disabled]="departmentForm.invalid"
                                    (click)="save()"
                                    >Enregistrer</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
