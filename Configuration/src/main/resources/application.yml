spring:
  application:
    name: configuration

  main:
    allow-bean-definition-overriding: true
    # allow-circular-references: true  # Décommentez si nécessaire

  servlet:
    multipart:
      max-file-size: 100000000MB
      max-request-size: 100000000MB

  doc:
    default-produces-media-type: application/json

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/db_configuration?createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root

