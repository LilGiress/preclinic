    refresh-token:
      expiration: 86400000

mailing:
  frontend:
    activation-url: http://localhost:4200/activation-code

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    ip-address: true

file:
  storage:
    location: ${user.home}/MedecineWebApp/profil

app:
  file:
    upload-dir: /opt/medical-files/

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type.descriptor.sql.BasicBinder: TRACE
      springframework: DEBUG

debug: true







