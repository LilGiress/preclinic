global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - "alert-rules.yml"

scrape_configs:
  - job_name: 'service-registry'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['service-registry:8761']

  - job_name: 'configuration'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['configuration:8888']

  - job_name: 'employees'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['employees:8081']

  - job_name: 'patients'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['patients:8082']

  - job_name: 'notification'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['notification:8083']

  - job_name: 'asset-management'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['asset-management:8084']

  - job_name: 'finance-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['finance-service:8085']

  - job_name: 'inventory-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['inventory-service:8086']

