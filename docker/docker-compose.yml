version: '3.8'

services:
  ### 🔹 SERVICE REGISTRY (Eureka) ###
  service-registry:
    image: giress/service-registry
    container_name: service-registry
    ports:
      - "8761:8761"
    networks:
      - monitoring

  ### 🔹 API GATEWAY ###
  api-gateway:
    image: giress/api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    networks:
      - monitoring
    depends_on:
      - service-registry

  ### 🔹 FINANCE SERVICE ###
  finance-service:
    image: giress/finance-service
    container_name: finance-service
    ports:
      - "8081:8081"
    networks:
      - monitoring
    depends_on:
      - service-registry
      - api-gateway

  ### 🔹 INVENTORY SERVICE ###
  inventory-service:
    image: giress/inventory-service
    container_name: inventory-service
    ports:
      - "8082:8082"
    networks:
      - monitoring
    depends_on:
      - service-registry
      - api-gateway

  ### 🔹 PATIENTS SERVICE ###
  patients-service:
    image: giress/patients-service
    container_name: patients-service
    ports:
      - "8083:8083"
    networks:
      - monitoring
    depends_on:
      - service-registry
      - api-gateway

  ### 🔹 EMPLOYEES SERVICE ###
  employees-service:
    image: giress/employees-service
    container_name: employees-service
    ports:
      - "8084:8084"
    networks:
      - monitoring
    depends_on:
      - service-registry
      - api-gateway

  ### 🔹 NOTIFICATION SERVICE ###
  notification-service:
    image: giress/notification-service
    container_name: notification-service
    ports:
      - "8085:8085"
    networks:
      - monitoring
    depends_on:
      - service-registry
      - api-gateway

  ### 🔹 ASSET MANAGEMENT SERVICE ###
  asset-management-service:
    image: giress/asset-management-service
    container_name: asset-management-service
    ports:
      - "8086:8086"
    networks:
      - monitoring
    depends_on:
      - service-registry
      - api-gateway

  ### 🔹 PROMETHEUS ###
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - monitoring
    depends_on:
      - service-registry
      - api-gateway
      - finance-service
      - inventory-service
      - patients-service
      - employees-service
      - notification-service
      - asset-management-service

  ### 🔹 ALERTMANAGER ###
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - ./alert-rules.yml:/etc/alertmanager/alert-rules.yml
    ports:
      - "9093:9093"
    networks:
      - monitoring
    depends_on:
      - prometheus

  ### 🔹 GRAFANA ###
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - monitoring
    depends_on:
      - prometheus

networks:
  monitoring:
    driver: bridge
